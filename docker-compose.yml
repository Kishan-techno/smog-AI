services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ml-service:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./ml-service:/app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./.env:/app/.env:ro
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/smog_saathi
      ML_SERVICE_URL: http://ml-service:8000
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - mongo
      - ml-service
    command: sh -c "npm install && npm start"
    ports:
      - "5000:5000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"

volumes:
  mongo_data:
